services:
  mcp-server:
    build: .
    env_file: .env
    profiles: ["prod", "dev"]
    environment:
      HOST: 0.0.0.0
      PORT: 8000
    volumes:
      - knowledge-base-data:/root/.knowledge-base
    restart: unless-stopped

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.ui
    env_file: .env
    profiles: ["prod", "dev"]
    environment:
      KNOWLEDGE_BASE_DATA_DIR: /root/.knowledge-base
    volumes:
      - knowledge-base-data:/root/.knowledge-base:ro
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --config /etc/cloudflared/config.yml run
    profiles: ["prod", "dev"]
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    depends_on:
      - mcp-server
      - streamlit
    restart: unless-stopped

  mcp-server-test:
    build: .
    profiles: ["test"]
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      AUTH_TOKEN_HASH: ${TEST_AUTH_TOKEN_HASH}
    ports:
      - "8000:8000"

volumes:
  knowledge-base-data:
