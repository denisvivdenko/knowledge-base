[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"

[project]
name = "knowledge-base"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.13.5",
    "mcp>=1.27,<2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.24",
    "anthropic>=0.40",
]
ui = [
    "streamlit>=1.62.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "e2e: end-to-end tests that spawn the real MCP server and call a real LLM (requires ANTHROPIC_API_KEY)",
]
